# One-click deploy on Render: New → Blueprint → select this repository.
# Creates a Node web service + a free PostgreSQL database and wires them together.
services:
  - type: web
    name: tartys
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tartys-db
          property: connectionString

databases:
  - name: tartys-db
    plan: free
    databaseName: tartys
